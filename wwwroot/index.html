<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sommelier — Thoughtful Pairings for Memorable Tables</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <div id="app">
        <div style="min-height: 100vh; background: #0f0b0c; display: flex; align-items: center; justify-content: center; color: #f5efe6; font-family: 'Cormorant Garamond', serif;">
            <div style="text-align: center;">
                <h1 style="font-size: 3rem; letter-spacing: 0.05em; margin-bottom: 0.5rem; font-weight: 500;">Sommelier</h1>
                <p style="color: #716b69; font-size: 0.875rem; letter-spacing: 0.2em; text-transform: uppercase;">Curating the cellar...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #881337; color: white; padding: 12px 24px; text-align: center; z-index: 1000;">
        An unhandled error has occurred.
        <a href="" class="reload" style="color: #fde68a; margin-left: 10px; text-decoration: underline;">Reload</a>
        <a class="dismiss" style="cursor: pointer; position: absolute; right: 20px; top: 12px;">✕</a>

    <script src="js/sommelier.js"></script>
